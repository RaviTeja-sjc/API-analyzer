spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USER}
    password: ${DATABASE_PASSWORD}
    hikari:
      maximum-pool-size: 15
      minimum-idle: 2
      connection-timeout: 30000
      max-lifetime: 1800000       # Close connections before DB firewall timeout (Supabase)
      keepalive-time: 30000       # Actively validate idle connections
      leak-detection-threshold: 60000 # Flag runaway transactions
  jpa:
    hibernate:
      ddl-auto: validate # NEVER auto-update schema in production
    show-sql: false

# Enforce strict missing property errors during startup in PROD
app:
  security:
    jwt:
      secret: ${JWT_SECRET}
    encryption:
      key: ${DB_ENCRYPTION_KEY}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
