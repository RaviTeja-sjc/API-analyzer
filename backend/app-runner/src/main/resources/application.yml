server:
  port: ${PORT:8080}
  shutdown: graceful

spring:
  lifecycle:
    timeout-per-shutdown-phase: 20s
  application:
    name: api-analyzer
  profiles:
    active: dev # Default to dev if not specified
    group:
      dev: dev
      prod: prod

management:
  endpoints:
    web:
      exposure:
        include: health, metrics, prometheus, info
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

app:
  security:
    jwt:
      secret: ${JWT_SECRET}
      expiration-ms: 86400000
    encryption:
      key: ${DB_ENCRYPTION_KEY}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
