server:
  port: 8080
spring:
  application:
    name: api-analyzer
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/postgres}?sslmode=require
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 20000
      idle-timeout: 300000
      max-lifetime: 1200000
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,flyway
  endpoint:
    health:
      show-details: always
  health:
    db:
      enabled: true
logging:
  level:
    root: INFO
    com.apianalyzer: DEBUG
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB
