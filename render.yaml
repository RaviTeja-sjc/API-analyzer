services:
  - type: web
    name: api-analyzer-backend
    env: docker
    dockerfilePath: ./backend/Dockerfile
    region: ohio
    plan: starter
    healthCheckPath: /actuator/health/liveness
    envVars:
      - key: PORT
        value: 8080
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      # The actual database URL comes from Render's internal network or Supabase
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_USER
        sync: false
      - key: DATABASE_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: DB_ENCRYPTION_KEY
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        value: https://your-frontend.onrender.com
    autoDeploy: false

  - type: web
    name: api-analyzer-frontend
    env: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./frontend/dist
    region: ohio
    plan: free
    autoDeploy: false
    envVars:
      - key: VITE_API_BASE_URL
        value: https://api-analyzer-backend.onrender.com/api/v1
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
